<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Placement Tracker</title>
	<link rel="icon" href="data:,">
	<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
	<main class="auth-card">
		<h1>Placement Tracker</h1>
		<p class="muted">Keep every job application in one place.</p>

		<div class="tabs" role="tablist">
			<button type="button" class="tab active" id="login-tab" role="tab" aria-selected="true" aria-controls="login-form">Log in</button>
			<button type="button" class="tab" id="signup-tab" role="tab" aria-selected="false" aria-controls="signup-form">Sign up</button>
		</div>

		<p class="message success" id="auth-success" role="status" hidden></p>
		<p class="message error" id="auth-error" role="alert" hidden></p>

		<form id="login-form" class="form">
			<label>Email
				<input type="email" id="login-email" autocomplete="email" required>
			</label>
			<label>Password
				<input type="password" id="login-password" autocomplete="current-password" required>
			</label>
			<button type="submit" class="button primary">Log in</button>
		</form>

		<form id="signup-form" class="form" hidden>
			<label>Name
				<input type="text" id="signup-name" autocomplete="name" required>
			</label>
			<label>Email
				<input type="email" id="signup-email" autocomplete="email" required>
			</label>
			<label>Password
				<input type="password" id="signup-password" autocomplete="new-password" minlength="6" maxlength="72" required>
			</label>
			<button type="submit" class="button primary">Create account</button>
		</form>
	</main>

	<script src="/js/api.js"></script>
	<script src="/js/auth.js"></script>
</body>
</html>
